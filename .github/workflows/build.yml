name: Build and test
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/TextSenderStudio/TextSenderStudio.csproj -c Release
      - shell: pwsh
        run: ./test.ps1
      - name: Build standalone single-file executable
        shell: pwsh
        run: ./build-singlefile.ps1
      - name: Check firmware Wi-Fi timing and reset behavior
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "STUDIO_VS=%%i"
          call "%STUDIO_VS%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          if not exist work\wifi-checks mkdir work\wifi-checks
          cl /nologo /EHsc /std:c++17 /W4 /WX firmware\tests\wifi_timing_checks.cpp /Fo:work\wifi-checks\wifi_timing_checks.obj /Fe:work\wifi-checks\wifi_timing_checks.exe
          if errorlevel 1 exit /b 1
          work\wifi-checks\wifi_timing_checks.exe
